name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release commit $release_commit is not on main." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tag and shared version
        run: python scripts/check_version.py --tag "${{ github.ref_name }}"

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.11'
          enable-cache: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project core --locked --no-default-groups --group dev

      - name: Build bundled core
        run: |
          make -C core gen
          make -C core pyinstaller

      - name: Copy bundled core
        run: Copy-Item core\dist\Final2x-core resources\Final2x-core -Recurse

      - name: Build desktop app
        run: pnpm run build:win-x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Archive unpacked app
        shell: pwsh
        run: |
          Push-Location dist\win-unpacked
          7z a -r "Final2x-windows-x64-unpacked.7z" *
          Pop-Location

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-windows-x64-unpacked
          path: dist/win-unpacked/Final2x-windows-x64-unpacked.7z

  macos:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.11'
          enable-cache: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project core --locked --no-default-groups --group dev

      - name: Build bundled core
        run: |
          make -C core gen
          make -C core pyinstaller

      - name: Copy bundled core
        run: cp -R core/dist/Final2x-core resources/

      - name: Build desktop app
        run: pnpm run build:mac-arm64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rename dmg
        run: mv dist/*.dmg dist/Final2x-macos-arm64-dmg.dmg

      - name: Archive unpacked app
        run: |
          cd dist/mac-arm64
          7z a -r Final2x-macos-arm64-unpacked.7z ./*

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-macos-arm64-dmg
          path: dist/Final2x-macos-arm64-dmg.dmg

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-macos-arm64-unpacked
          path: dist/mac-arm64/Final2x-macos-arm64-unpacked.7z

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run build:linux-x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rename packages
        run: |
          mv dist/*.snap dist/Final2x-linux-pip-x64-snap.snap
          mv dist/*.AppImage dist/Final2x-linux-pip-x64-AppImage.AppImage
          mv dist/*.deb dist/Final2x-linux-pip-x64-deb.deb

      - name: Archive unpacked app
        run: |
          cd dist/linux-unpacked
          7z a -r Final2x-linux-pip-x64-unpacked.7z ./*

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-linux-pip-x64
          path: |
            dist/Final2x-linux-pip-x64-snap.snap
            dist/Final2x-linux-pip-x64-AppImage.AppImage
            dist/Final2x-linux-pip-x64-deb.deb
            dist/linux-unpacked/Final2x-linux-pip-x64-unpacked.7z

  pypi:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.11'
          enable-cache: false

      - name: Build Python distribution
        run: uv build core

      - name: Publish Python distribution to PyPI
        if: github.repository == 'EutropicAI/Final2x'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API }}
          packages-dir: core/dist/

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release artifacts
        run: |
          mkdir dist
          find artifacts -type f -print0 | xargs -0 -I{} cp "{}" dist/
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
