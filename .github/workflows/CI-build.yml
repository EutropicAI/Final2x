name: CI-build

on:
  push:
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.11'
          enable-cache: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project core --locked --no-default-groups --group dev

      - name: Build bundled core
        run: |
          make -C core gen
          make -C core pyinstaller

      - name: Copy bundled core
        run: Copy-Item core\dist\Final2x-core resources\Final2x-core -Recurse

      - name: Smoke-test bundled core
        run: resources\Final2x-core\Final2x-core.exe -h

      - name: Build desktop app
        run: pnpm run build:win-x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Smoke-test self-contained packaged core
        shell: pwsh
        run: |
          Move-Item core\dist\Final2x-core "$env:RUNNER_TEMP\Final2x-core-build"
          Move-Item resources\Final2x-core "$env:RUNNER_TEMP\Final2x-core-staged"
          & "dist\win-unpacked\resources\Final2x-core\Final2x-core.exe" -h

      - name: Archive unpacked app
        shell: pwsh
        run: |
          Push-Location dist\win-unpacked
          7z a -r "Final2x-windows-x64-unpacked.7z" *
          Pop-Location

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-windows-x64-unpacked
          path: dist/win-unpacked/Final2x-windows-x64-unpacked.7z

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.11'
          enable-cache: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project core --locked --no-default-groups --group dev

      - name: Build bundled core
        run: |
          make -C core gen
          make -C core pyinstaller

      - name: Copy bundled core
        run: cp -R core/dist/Final2x-core resources/

      - name: Smoke-test bundled core
        run: resources/Final2x-core/Final2x-core -h

      - name: Build desktop app
        run: pnpm run build:mac-arm64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Smoke-test self-contained packaged core
        run: |
          mv core/dist/Final2x-core "$RUNNER_TEMP/Final2x-core-build"
          mv resources/Final2x-core "$RUNNER_TEMP/Final2x-core-staged"
          dist/mac-arm64/Final2x.app/Contents/Resources/Final2x-core/Final2x-core -h

      - name: Archive unpacked app
        run: |
          cd dist/mac-arm64
          7z a -r Final2x-macos-arm64-unpacked.7z ./*

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-macos-arm64-dmg
          path: dist/*.dmg

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-macos-arm64-unpacked
          path: dist/mac-arm64/Final2x-macos-arm64-unpacked.7z

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run build:linux-x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Archive unpacked app
        run: |
          cd dist/linux-unpacked
          7z a -r Final2x-linux-pip-x64-unpacked.7z ./*

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-linux-pip-x64
          path: |
            dist/*.snap
            dist/*.AppImage
            dist/*.deb
            dist/linux-unpacked/Final2x-linux-pip-x64-unpacked.7z
